<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Late Show · My movie list</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><div class="brand"><span aria-hidden="true">✳</span> Late Show</div><span>Personal screening room</span></header>
  <main>
    <section class="ticket" aria-labelledby="page-title">
      <div class="ticket-body"><h1 id="page-title">My movie list<span>.</span></h1><p>Keep the films you want to see. Check them off after the credits.</p></div>
      <div class="stub" aria-hidden="true"><b>ADMIT ONE</b><div class="barcode"></div><span>★ ★ ★</span></div>
    </section>
    <form><label for="title">Add a movie</label><div class="entry"><input id="title" placeholder="Enter a movie title" maxlength="200" required autocomplete="off"><button>Add movie</button></div></form>
    <section><div class="list-head"><h2>Watchlist</h2><span id="count"></span></div><ul></ul><p id="empty">Your watchlist is empty. Add your first movie above.</p></section>
    <p role="status" id="notice"></p>
  </main>
</body>
</html>
